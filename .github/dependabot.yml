# npm-обновления касаются только devDependencies (tsdown,
# @deepseek-ai/schemastery): единственная рантайм-зависимость — peer
# schemastery, её разрешает каталог установки DSH. Обновление dev-пакета
# приходит вместе с новым package-lock.json, и CI сразу проверяет, что
# собранный client.js от него не поменялся.
#
# TypeScript в devDependencies намеренно не объявлен: сборка идёт через
# tsdown с `dts: false`, объявления не генерируются, а сам tsdown приносит
# TypeScript себе как peer, когда он ему действительно нужен. Пока объявление
# стояло, Dependabot предлагал мажорную 7.x (переписанный на Go компилятор);
# ignore ниже не даёт этому повториться, если пакет вернётся в зависимости.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:10"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"