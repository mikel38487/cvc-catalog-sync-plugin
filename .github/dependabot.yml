# npm-обновления касаются только devDependencies (tsdown, typescript,
# @deepseek-ai/schemastery): единственная рантайм-зависимость — peer
# schemastery, её разрешает каталог установки DSH. Обновление dev-пакета
# приходит вместе с новым package-lock.json, и CI сразу проверяет, что
# собранный client.js от него не поменялся.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:10"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
