name: Publish

# Trusted Publishing: в настройках npm-пакета репозиторий
# mikel38487/cvc-catalog-sync-plugin, workflow `publish.yml` и окружение `npm`
# указаны как trusted publisher. Долгоживущего токена нет: права выдаёт OIDC
# (id-token: write), а к тарболу прикладывается provenance.
#
# Триггеры:
#   release: published — основной путь. Тег создаётся вместе с релизом,
#                        тег обязан совпадать с version из package.json;
#   workflow_dispatch  — ручной прогон; публикует версию из package.json.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 ставит npm 11, а обмен OIDC-токена (Trusted Publishing)
          # появился в npm 11.5.1 — на Node 22 с npm 10 будет ENEEDAUTH.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Версия из тега/релиза обязана совпадать с package.json, иначе 2.0.0
      # может уехать под чужим тегом. Ручной прогон проверяет только формат.
      - name: Version matches the release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -e "process.stdout.write(require('./package.json').version)")"
          echo "package.json version: ${version}"
          if [ "${EVENT_NAME}" != "release" ]; then
            echo "event ${EVENT_NAME}: tag check skipped (manual run publishes ${version})"
            exit 0
          fi
          tag="${RELEASE_TAG}"
          echo "release tag: ${tag:-<empty>}"
          if [ -z "${tag}" ]; then
            echo "::error::release tag is empty"
            exit 1
          fi
          if [ "${tag#v}" != "${version}" ]; then
            echo "::error::tag ${tag} does not match package.json version ${version}"
            exit 1
          fi
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Build client
        run: npm run build
      - name: Built client.js matches the committed one
        run: git diff --exit-code -- client.js
      - name: Package contents
        run: node tools/assert-pack.mjs
      # Trusted Publishing обменивает OIDC-токен GitHub на короткоживущий токен
      # npm по утверждённому npm-пакету. Привязка задана один раз в настройках
      # пакета на npmjs.com («Trusted publishing» → этот репозиторий, workflow
      # publish.yml, окружение npm). Без неё в логе будет ENEEDAUTH.
      - name: Trusted publishing exchange
        run: |
          set -euo pipefail
          name="$(node -e "process.stdout.write(require('./package.json').name)")"
          version="$(node -e "process.stdout.write(require('./package.json').version)")"
          if [ "$(npm view "${name}@${version}" version 2>/dev/null)" = "${version}" ]; then
            echo "${name}@${version} is already published; nothing to do"
            exit 0
          fi
          if ! npm publish --access public --provenance; then
            echo "::error::npm publish failed: check the Trusted publishing configuration for ${name} at https://www.npmjs.com/package/${name}/access"
            exit 1
          fi
      - name: Verify the published version
        run: |
          set -euo pipefail
          name="$(node -e "process.stdout.write(require('./package.json').name)")"
          version="$(node -e "process.stdout.write(require('./package.json').version)")"
          # Реестр обрабатывает публикацию асинхронно: "may take a few minutes".
          # Ждём до десяти минут, прежде чем считать релиз сломанным.
          for attempt in $(seq 1 20); do
            published="$(npm view "${name}@${version}" version 2>/dev/null || true)"
            if [ "${published}" = "${version}" ]; then
              echo "${name}@${version} is published"
              exit 0
            fi
            echo "attempt ${attempt}: ${name}@${version} is not visible yet; sleeping 30s"
            sleep 30
          done
          echo "::error::${name}@${version} is not visible in the registry ten minutes after publish"
          exit 1
          npm view "${name}@${version}" dist.attestations 2>/dev/null || true