name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Тесты хоста и клиента на всём поддерживаемом диапазоне Node.
  # 20 — нижняя граница engines, 22/24 — LTS и текущая ветка.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # package-lock.json в репозитории, поэтому npm ci: установка строго по
      # lock-файлу, любое расхождение с package.json падает здесь, а не в релизе.
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test

  # Сборка клиента вынесена отдельно: tsdown 0.23 требует Node >= 22.18,
  # поэтому на 20-й ветке проверяются только тесты.
  build:
    name: build and package (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build client
        run: npm run build
      # client.js коммитится в git: пользователь ставит плагин из npm или из git
      # без сборки. Расхождение собранного файла с коммитом — ошибка.
      - name: Built client.js matches the committed one
        run: git diff --exit-code -- client.js
      # Состав тарбола: обязательные файлы на месте, исходники и тесты не утекли.
      - name: Package contents
        run: node tools/assert-pack.mjs
