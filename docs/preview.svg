<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Settings page with three feature switches, coefficient badges in the model picker and the balance panel">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5a4"/>
    </linearGradient>
  </defs>

  <!-- canvas: neutral slate that reads on both a light and a dark page -->
  <rect width="640" height="300" fill="#94a3b8"/>
  <rect x="8" y="8" width="624" height="284" rx="16" fill="url(#page)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- left column: settings page -->
  <g>
    <rect x="28" y="28" width="252" height="244" rx="12" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
    <rect x="44" y="44" width="88" height="12" rx="6" fill="#1f2937"/>
    <rect x="44" y="64" width="160" height="7" rx="3.5" fill="#c3cddb"/>

    <!-- feature switches -->
    <rect x="44" y="84" width="220" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="58" y="96" width="196" height="14" rx="7" fill="#e2e8f0"/>

    <rect x="58" y="118" width="34" height="18" rx="9" fill="url(#brand)"/>
    <circle cx="83" cy="127" r="7" fill="#ffffff"/>
    <rect x="100" y="122" width="120" height="9" rx="4.5" fill="#94a3b8"/>

    <rect x="58" y="142" width="34" height="18" rx="9" fill="url(#brand)"/>
    <circle cx="83" cy="151" r="7" fill="#ffffff"/>
    <rect x="100" y="146" width="96" height="9" rx="4.5" fill="#94a3b8"/>

    <!-- parameter groups -->
    <rect x="44" y="160" width="106" height="58" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="56" y="172" width="62" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="56" y="186" width="82" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="56" y="199" width="70" height="7" rx="3.5" fill="#e2e8f0"/>

    <rect x="158" y="160" width="106" height="58" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="170" y="172" width="52" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="170" y="186" width="82" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="170" y="199" width="60" height="7" rx="3.5" fill="#e2e8f0"/>

    <!-- buttons: primary + two secondary -->
    <rect x="44" y="228" width="52" height="22" rx="7" fill="#2563eb"/>
    <rect x="104" y="228" width="60" height="22" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="172" y="228" width="60" height="22" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- right column, top: model picker with badges -->
  <g>
    <rect x="296" y="28" width="316" height="132" rx="12" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
    <rect x="312" y="42" width="72" height="9" rx="4.5" fill="#1f2937"/>
    <rect x="312" y="60" width="284" height="26" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="322" y="70" width="70" height="7" rx="3.5" fill="#94a3b8"/>

    <!-- model rows: name + badge -->
    <rect x="312" y="96" width="96" height="9" rx="4.5" fill="#475569"/>
    <rect x="416" y="91" width="44" height="18" rx="6" fill="#e8f7ef" stroke="#34d399" stroke-width="1.5"/>
    <rect x="425" y="97" width="26" height="6" rx="3" fill="#16a34a"/>

    <rect x="480" y="93" width="14" height="14" rx="3" fill="#cbd5e1"/>
    <rect x="498" y="93" width="90" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="480" y="117" width="14" height="14" rx="3" fill="#cbd5e1"/>
    <rect x="498" y="117" width="72" height="9" rx="4.5" fill="#cbd5e1"/>

    <rect x="312" y="116" width="80" height="9" rx="4.5" fill="#475569"/>
    <rect x="400" y="111" width="44" height="18" rx="6" fill="#fdf3e3" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="409" y="117" width="26" height="6" rx="3" fill="#d97706"/>

    <rect x="312" y="136" width="60" height="9" rx="4.5" fill="#94a3b8"/>
    <rect x="380" y="131" width="44" height="18" rx="6" fill="#fde8e8" stroke="#f87171" stroke-width="1.5"/>
    <rect x="389" y="137" width="26" height="6" rx="3" fill="#dc2626"/>

    <!-- sidebar button with a status dot -->
    <circle cx="566" cy="64" r="5" fill="#3fb950"/>
  </g>

  <!-- right column, bottom: balance panel -->
  <g>
    <rect x="296" y="172" width="316" height="100" rx="12" fill="#111827" stroke="#2b3a4d" stroke-width="2"/>
    <rect x="312" y="186" width="84" height="10" rx="5" fill="#f8fafc"/>
    <rect x="548" y="184" width="14" height="14" rx="4" fill="#334155"/>

    <rect x="312" y="206" width="60" height="18" rx="6" fill="#1f2937" stroke="#334155" stroke-width="1.5"/>
    <rect x="380" y="206" width="70" height="18" rx="6" fill="#1f2937" stroke="#334155" stroke-width="1.5"/>

    <rect x="312" y="234" width="284" height="26" rx="8" fill="#1b2431" stroke="#334155" stroke-width="1.5"/>
    <circle cx="328" cy="247" r="6" fill="#3fb950"/>
    <rect x="342" y="243" width="90" height="8" rx="4" fill="#64748b"/>
    <rect x="522" y="240" width="60" height="14" rx="7" fill="#e2e8f0"/>
  </g>

  <!-- switches drive the right-hand surfaces -->
  <path d="M280 120h16" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
  <path d="M280 150h16" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
</svg>