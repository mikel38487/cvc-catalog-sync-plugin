# Хост-половина плагина CheapVibeCode: каталог моделей, коэффициенты, баланс.
#
# Три функции живут в одном плагине и включаются по отдельности группой
# `features`: синхронизация каталога (models в строку llm-pi-ai профильного
# патча + allowedModels сабагентов), бейджи коэффициентов в выборе модели и
# баланс ключа в сайдбаре. Выключенная функция не регистрирует ни маршрут, ни
# таймер, ни инструмент; страница настроек остаётся всегда — это и есть
# переключатель. Остальные группы конфига (providers, catalog, coefficients,
# balance) объявлены в схеме со значениями по умолчанию, поэтому здесь их
# держать не нужно. Описание полей — README.md, docs/ARCHITECTURE.md.

- insert:
    - id: cvc-catalog-sync
      name: 'cvc-catalog-sync-plugin'
      config:
        features:
          catalogSync: true
          coefficients: true
          balance: true
